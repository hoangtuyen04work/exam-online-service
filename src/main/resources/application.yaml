management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  address: 0.0.0.0
  port: 8888
  servlet:
    context-path: /exam-online-system

spring:
  config:
    import:
      - optional:classpath:application-local.yaml
  application:
    name: exam-online-system
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
#    url: ${URL:jdbc:mysql://localhost:3306/exam_online_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
#    username: ${USERNAME:root}
#    password: ${PASSWORD:123}
    url: "${URL:jdbc:mysql://localhost:3306/exam_online_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - User.Read
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0


jwt:
  secret: "${JWT_SECRET:}"
  expiration: "${JWT_EXPIRATION:}"

logging:
  level:
    com.azure.spring: DEBUG
    org.springframework.security: DEBUG
    edu.exam_online.exam_online_system: DEBUG
origin: "${ORIGIN:http://localhost:3000}"
email:
  name: "${EMAIL:}"

api:
  key: "${BREVO-KEY:null}"

# OpenRouter AI Configuration
openrouter:
  api:
    key: "${OPENROUTER_API_KEY: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}"
    url: "https://openrouter.ai/api/v1/chat/completions"
  model: "${OPENROUTER_MODEL:openai/gpt-3.5-turbo}"